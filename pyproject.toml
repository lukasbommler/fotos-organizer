[project]
name = "fotoduenner"
version = "0.1.0"
description = "Offline Windows tool that thins out holiday photo albums. Never deletes anything."
readme = "docs/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=11",
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "pywebview>=5.3",
    "psutil>=6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "piexif>=1.1",
]

[project.scripts]
fotoduenner = "fotoduenner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fotoduenner"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]
# German UI texts and docstrings use the en dash.
allowed-confusables = ["–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: tests that need a real album (FOTODUENNER_REAL_ALBUM), run locally only",
]

[tool.uv]
# The shared uv cache has hardlinks into a OneDrive-synced venv of another project;
# Windows refuses further hardlinks to cloud files (os error 396). Copy instead.
link-mode = "copy"
